<!doctype html>
<html ⚡ lang="id">
<head>
  <meta charset="utf-8">

  <title>Dutaslot Network Situs Game Portabel Kekinian Dengan Fitur Terlengkap</title>

  <meta name="description" content="Dutaslot Network platform terpercaya yang menyediakan permainan berkualitas sehingga memberi pengalaman terbaik bagi player duta media apk mobile.">

  <link rel="canonical" href="https://www.rmsft.com/">

  <meta name="viewport" content="width=device-width,minimum-scale=1,initial-scale=1">

  <link rel="shortcut icon" href="https://gbrs.pages.dev/Favicon-Dutaslot.webp">

  <!-- AMP runtime -->
  <script async src="https://cdn.ampproject.org/v0.js"></script>

  <script async custom-element="amp-bind" src="https://cdn.ampproject.org/v0/amp-bind-0.1.js">
  </script>

  <script async custom-element="amp-video" src="https://cdn.ampproject.org/v0/amp-video-0.1.js">
  </script>

  <!-- AMP BOILERPLATE -->
  <style amp-boilerplate>
    body {
      -webkit-animation:-amp-start 8s steps(1,end) 0s 1 normal both;
      -moz-animation:-amp-start 8s steps(1,end) 0s 1 normal both;
      -ms-animation:-amp-start 8s steps(1,end) 0s 1 normal both;
      animation:-amp-start 8s steps(1,end) 0s 1 normal both;
    }

    @-webkit-keyframes -amp-start {
      from { visibility:hidden; }
      to { visibility:visible; }
    }

    @-moz-keyframes -amp-start {
      from { visibility:hidden; }
      to { visibility:visible; }
    }

    @-ms-keyframes -amp-start {
      from { visibility:hidden; }
      to { visibility:visible; }
    }

    @-o-keyframes -amp-start {
      from { visibility:hidden; }
      to { visibility:visible; }
    }

    @keyframes -amp-start {
      from { visibility:hidden; }
      to { visibility:visible; }
    }
  </style>

  <noscript>
    <style amp-boilerplate>
      body {
        -webkit-animation:none;
        -moz-animation:none;
        -ms-animation:none;
        animation:none;
      }
    </style>
  </noscript>

  <!-- CUSTOM CSS -->
  <style amp-custom>

    * {
      box-sizing:border-box;
    }

    body {
      margin:0;
      min-height:100vh;
      padding:18px 10px;

      font-family:Arial, sans-serif;

      display:flex;
      justify-content:center;
      align-items:center;
      flex-direction:column;

      gap:16px;
      overflow:hidden;

      background:#0c0c0c;
      position:relative;
    }

    /* ========================= */
    /* BACKGROUND                */
    /* ========================= */

    .bg-main {
      position:fixed;
      inset:0;
      z-index:-99;
    }

    /* ========================= */
    /* LOGO                      */
    /* ========================= */

    .logo-wrap {
      position:relative;

      width:260px;
      max-width:78vw;

      margin-bottom:8px;

      z-index:60;
      line-height:0;

      animation:logoEnter .9s ease-out both;

      filter:
        drop-shadow(0 0 8px #fed804)
        drop-shadow(0 0 18px #fed804);
    }

    .site-logo {
      display:block;
      width:100%;
    }

    @keyframes logoEnter {
      0% {
        opacity:0;
        transform:translateY(-30px) scale(.9);
      }

      100% {
        opacity:1;
        transform:translateY(0) scale(1);
      }
    }

    /* ========================= */
    /* CARD STACK                */
    /* ========================= */

    .card-stack {
      position:relative;

      width:280px;
      height:400px;

      max-width:86vw;

      z-index:20;
    }

    .card {
      position:absolute;
      inset:0;

      border-radius:20px;
      overflow:hidden;

      opacity:0;

      transition:
        transform .5s ease,
        opacity .5s ease;
    }

    .active {
      transform:scale(1.05) translateY(-15px);
      opacity:1;
      z-index:20;
    }

    /* Frame images */

    .frame-base,
    .frame-top {
      position:absolute;
      inset:0;

      width:100%;
      height:100%;

      object-fit:cover;

      z-index:2;
    }

    .frame-base {
      opacity:.78;
    }

    .frame-top {
      z-index:4;
      pointer-events:none;
    }

    /* Video inside card */

    amp-video {
      position:absolute;
      inset:0;

      width:100%;
      height:100%;

      object-fit:cover;

      z-index:3;
    }

    /* Hologram overlay */

    .holo {
      position:absolute;
      inset:0;

      z-index:5;
      pointer-events:none;

      mix-blend-mode:overlay;

      background:linear-gradient(
        120deg,
        #000000,
      );

      background-size:300% 300%;

      animation:holo 7s linear infinite;
    }

    @keyframes holo {
      0% {
        background-position:0% 50%;
      }

      50% {
        background-position:100% 50%;
      }

      100% {
        background-position:0% 50%;
      }
    }

    /* Scatter animations */

    .card-login {
      animation:scatterL 1s ease-out forwards;
    }

    .card-daftar {
      animation:scatterD 1s ease-out forwards .2s;
    }

    @keyframes scatterL {
      0% {
        transform:
          translate(-200px,-150px)
          rotate(-40deg)
          scale(.8);

        opacity:0;
      }

      100% {
        transform:
          rotate(-8deg)
          translateX(-10px);

        opacity:1;
      }
    }

    @keyframes scatterD {
      0% {
        transform:
          translate(200px,150px)
          rotate(40deg)
          scale(.8);

        opacity:0;
      }

      100% {
        transform:
          rotate(8deg)
          translateX(10px);

        opacity:1;
      }
    }

    /* ========================= */
    /* BUTTON GROUP              */
    /* ========================= */

    .button-group {
      display:flex;
      justify-content:center;
      align-items:center;

      gap:20px;

      z-index:50;
    }

    .btn {
      display:inline-flex;
      justify-content:center;
      align-items:center;

      min-width:110px;
      padding:10px 26px;

      border-radius:28px;

      font-size:16px;
      font-weight:600;
      line-height:1.2;
      text-align:center;
      text-decoration:none;

      color:#000000;

      border:2px solid #fed804;
      background:#fed804;

      box-shadow:
        0 0 12px #fed804,
        0 0 22px #fed804,
        inset 0 0 12px #fed804;

      transition:transform .35s ease;

      animation:btnPulse 2.6s infinite ease-in-out;
    }

    @keyframes btnPulse {
      0% {
        box-shadow:
          0 0 10px #fed804,
          0 0 18px #fed804,
          inset 0 0 10px #fed804;
      }

      50% {
        box-shadow:
          0 0 16px #fed804,
          0 0 26px #fed804,
          inset 0 0 14px #fed804;
      }

      100% {
        box-shadow:
          0 0 10px #fed804,
          0 0 18px #fed804,
          inset 0 0 10px #fed804;
      }
    }

    .btn:active,
    .btn:focus {
      transform:scale(1.07);

      box-shadow:
        0 0 18px #fed804,
        0 0 32px #fed804,
        inset 0 0 18px #fed804;
    }

    .btn-daftar {
      color:#000;

      border:none;

      background:linear-gradient(
        90deg,
        #fed804,
        #fed804
      );

      box-shadow:
        0 0 14px #fed804,
        0 0 24px #fed804,
        inset 0 0 14px #fed804;
    }

    /* ========================= */
    /* RESPONSIVE MOBILE         */
    /* ========================= */

    @media (max-width:380px) {
      .logo-wrap {
        width:220px;
      }

      .card-stack {
        width:250px;
        height:357px;
      }

      .button-group {
        gap:12px;
      }

      .btn {
        min-width:100px;
        padding:9px 20px;
        font-size:15px;
      }
    }

    @media (max-height:650px) {
      body {
        gap:9px;
        padding-top:8px;
        padding-bottom:8px;
      }

      .logo-wrap {
        width:190px;
        margin-bottom:2px;
      }

      .card-stack {
        width:225px;
        height:321px;
      }

      .button-group {
        gap:12px;
      }

      .btn {
        min-width:95px;
        padding:8px 18px;
        font-size:14px;
      }
    }

  </style>
</head>

<body>

  <!-- BACKGROUND -->
  <amp-img src="https://imgstore.io/images/2025/03/03/Dutaslot-gif-background-petir.gif" layout="fill" class="bg-main" alt="Background Dutaslot">
  </amp-img>

  <!-- CARD STATE -->
  <amp-state id="cardState">
    <script type="application/json">
      {
        "active": "none"
      }
    </script>
  </amp-state>

  <!-- LOGO DI ATAS GAMBAR -->
  <div class="logo-wrap">
    <amp-img class="site-logo" src="https://gbrs.pages.dev/Dutaslot.gif" width="320" height="100" layout="responsive" alt="Logo Dutaslot">
    </amp-img>
  </div>

  <!-- CARD STACK -->
  <div class="card-stack">

    <!-- LOGIN CARD -->
    <div class="card card-login" [class]="cardState.active == 'login'
        ? 'card card-login active'
        : 'card card-login'">

      <amp-img src="https://luckyluckcomp.github.io/invoker/Dutaslot.webp" layout="fill" class="frame-base" alt="Kartu login Dutaslot">
      </amp-img>

      <amp-img src="https://luckyluckcomp.github.io/invoker/Dutaslot.webp" layout="fill" class="frame-top" alt="">
      </amp-img>

      <div class="holo"></div>
    </div>

    <!-- DAFTAR CARD -->
    <div class="card card-daftar" [class]="cardState.active == 'daftar'
        ? 'card card-daftar active'
        : 'card card-daftar'">

      <amp-img src="https://luckyluckcomp.github.io/invoker/Dutaslot.webp" layout="fill" class="frame-base" alt="Kartu daftar Dutaslot">
      </amp-img>

      <amp-img src="https://luckyluckcomp.github.io/invoker/Dutaslot.webp" layout="fill" class="frame-top" alt="">
      </amp-img>

      <div class="holo"></div>
    </div>

  </div>

  <!-- BUTTONS -->
  <div class="button-group">

    <a class="btn" target="_blank" rel="nofollow noopener noreferrer" href="https://bit.ly/dutaslot_" on="tap:AMP.setState({cardState:{active:'login'}})">
      Login
    </a>

    <a class="btn btn-daftar" target="_blank" rel="nofollow noopener noreferrer" href="https://bit.ly/dutaslot_" on="tap:AMP.setState({cardState:{active:'daftar'}})">
      Daftar
    </a>

    <a class="btn" target="_blank" rel="nofollow noopener noreferrer" href="https://bit.ly/dutaslot_" on="tap:AMP.setState({cardState:{active:'login'}})">
      Livechat
    </a>

    <a class="btn" target="_blank" rel="nofollow noopener noreferrer" href="https://bit.ly/dutaslot_" on="tap:AMP.setState({cardState:{active:'login'}})">
      Prediksi
    </a>
  </div>

</body>
</html>
